name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Directory.Build.props'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Push the tag and create the GitHub release.
      id-token: write  # GitHub OIDC token for nuget.org Trusted Publishing.

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Extract version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack Tellurian.Utilities/Tellurian.Utilities.csproj --no-build --configuration Release --output ./nupkg

      # Trusted Publishing: exchanges the OIDC token for an API key valid for one hour; no stored API key.
      # Requires a Trusted Publishing policy on nuget.org for this repository and release.yml,
      # The user is the policy owner's nuget.org profile name (not the email address); it isn't a secret.
      - name: NuGet login (OIDC → temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: tellurian

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create and push tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "v${{ steps.version.outputs.VERSION }}" -m "Release v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: ./nupkg/*
          generate_release_notes: true
