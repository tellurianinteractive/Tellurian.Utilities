name: Publish NuGet package

# Packs Tellurian.Utilities and pushes it to nuget.org, then tags v<Version> and creates the GitHub release.
# Push to master: publishes when nuget.org has no Tellurian.Utilities with <Version> from Directory.Build.props yet.
# Manual run: publishes the current version; a version already on nuget.org is skipped.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Push the tag and create the GitHub release.
      id-token: write # OIDC for nuget.org trusted publishing.
    steps:
      - uses: actions/checkout@v7

      - name: Decide whether to publish
        id: version
        env:
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1 | tr -d '[:space:]')
          if [ -z "$version" ]; then echo "::error::No <Version> found in Directory.Build.props"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          lower=$(echo "$version" | tr '[:upper:]' '[:lower:]')
          if curl -sf "https://api.nuget.org/v3-flatcontainer/tellurian.utilities/$lower/tellurian.utilities.nuspec" > /dev/null; then
            if [ "$IS_MANUAL" = "true" ]; then
              echo "Version $version is on nuget.org; manual run, publishing again (the push skips duplicates)."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "Version $version is already on nuget.org, nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Version $version is new and will be published."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.publish == 'true'
        with:
          global-json-file: global.json

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: dotnet test --project Tellurian.Utilities.Tests --configuration Release

      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: dotnet pack Tellurian.Utilities --configuration Release --output nupkgs

      # Trusted publishing policy on nuget.org: owner tellurian, repository tellurianinteractive/Tellurian.Utilities,
      # workflow publish.yml. The user is the nuget.org profile name, not a secret; the API key lives about an hour.
      - name: NuGet login
        id: login
        if: steps.version.outputs.publish == 'true'
        uses: NuGet/login@v1
        with:
          user: tellurian

      - name: Push to nuget.org
        if: steps.version.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Tag and GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION exists; no new release."
            exit 0
          fi
          awk -v heading="## Release $VERSION" '$0 == heading {found=1; next} found && /^## Release / {exit} found {print}' RELEASENOTES.md > release-notes.md
          gh release create "v$VERSION" nupkgs/* --target "$GITHUB_SHA" --title "Release $VERSION" --notes-file release-notes.md

      - name: Summary
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "### Published to nuget.org, version $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Tellurian.Utilities](https://www.nuget.org/packages/Tellurian.Utilities/$VERSION)" >> "$GITHUB_STEP_SUMMARY"
